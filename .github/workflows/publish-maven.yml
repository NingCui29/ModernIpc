name: Publish anonymous Maven repository

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing Release tag to mirror without rebuilding its artifacts'
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: anonymous-maven-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      # Use current publishing tools when mirroring an older immutable Release.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate requested tag
        run: |
          python - <<'PY'
          import os, re, subprocess
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v\d+\.\d+\.\d+(?:-[0-9A-Za-z][0-9A-Za-z.-]*)?', tag):
              raise SystemExit('Expected an existing release version tag')
          subprocess.run(['git', 'rev-parse', '--verify', 'refs/tags/' + tag + '^{commit}'], check=True)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as stream:
              stream.write('RELEASE_VERSION=' + tag[1:] + '\n')
              stream.write('MAVEN_DIR=' + os.environ['RUNNER_TEMP'] + '/maven-repository\n')
              stream.write('BUNDLE_DIR=' + os.environ['RUNNER_TEMP'] + '/maven-bundle\n')
          PY

      - name: Download the existing immutable Release bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern maven-repository.zip --pattern manifest.json --pattern SHA256SUMS.txt \
            --dir "$BUNDLE_DIR"
          python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          directory = Path(os.environ['BUNDLE_DIR'])
          sums = dict((name.lstrip('*'), digest) for digest, name in
                      (line.split(maxsplit=1) for line in (directory / 'SHA256SUMS.txt').read_text().splitlines()))
          for name in ('manifest.json', 'maven-repository.zip'):
              if hashlib.sha256((directory / name).read_bytes()).hexdigest() != sums.get(name):
                  raise SystemExit('Release checksum mismatch: ' + name)
          manifest = json.loads((directory / 'manifest.json').read_text())
          tag = os.environ['RELEASE_TAG']
          commit = subprocess.check_output(['git', 'rev-parse', 'refs/tags/' + tag + '^{commit}'], text=True).strip()
          if manifest.get('tag') != tag or manifest.get('commit') != commit:
              raise SystemExit('Manifest does not match the immutable source tag')
          PY

      - name: Test publication and consumer validation helpers
        run: python -m unittest discover -s tests/release -p 'test_*.py' -v

      - name: Read existing Maven branch
        run: |
          mkdir -p "$MAVEN_DIR"
          git ls-remote --heads origin refs/heads/maven > "$RUNNER_TEMP/maven-ref"
          if test -s "$RUNNER_TEMP/maven-ref"; then
            git fetch origin refs/heads/maven:refs/remotes/origin/maven
            git archive refs/remotes/origin/maven | tar -x -C "$MAVEN_DIR"
            echo "MAVEN_PARENT=$(git rev-parse refs/remotes/origin/maven)" >> "$GITHUB_ENV"
          fi

      - name: Validate and merge all seven publications
        run: |
          python scripts/publish_anonymous_maven.py prepare \
            --archive "$BUNDLE_DIR/maven-repository.zip" --manifest "$BUNDLE_DIR/manifest.json" \
            --repository "$MAVEN_DIR" --version "$RELEASE_VERSION" \
            --source-repository "$GITHUB_REPOSITORY"

      - name: Publish Maven branch without replacing existing history
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          export GIT_INDEX_FILE="$RUNNER_TEMP/maven-index"
          export GIT_WORK_TREE="$MAVEN_DIR"
          git read-tree --empty
          git --work-tree="$MAVEN_DIR" -C "$MAVEN_DIR" --git-dir="$GITHUB_WORKSPACE/.git" add --force --all
          tree=$(git write-tree)
          parent_args=()
          if test -n "${MAVEN_PARENT:-}"; then
            if test "$tree" = "$(git rev-parse "$MAVEN_PARENT^{tree}")"; then
              echo 'Identical artifacts are already published.'
              exit 0
            fi
            parent_args=(-p "$MAVEN_PARENT")
          fi
          commit=$(printf 'Publish anonymous Maven %s\n' "$RELEASE_VERSION" | git commit-tree "$tree" "${parent_args[@]}")
          git push origin "$commit:refs/heads/maven"

      - name: Verify every remote file without credentials
        run: |
          python scripts/publish_anonymous_maven.py verify \
            --repository "$MAVEN_DIR" --version "$RELEASE_VERSION" \
            --base-url "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/maven" \
            --attempts 6 --workers 8 --output "$RUNNER_TEMP/anonymous-downloads.json"

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install consumer SDK
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'

      - name: Compile independent consumers from the anonymous repository
        run: |
          python scripts/verify_maven_consumers.py \
            --remote-repository "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/maven" \
            --version "$RELEASE_VERSION" --java-home "$JAVA_HOME" --android-sdk "$ANDROID_HOME" \
            --output "$RUNNER_TEMP/anonymous-consumers"

      - name: Preserve anonymous publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anonymous-maven-${{ inputs.tag }}
          path: |
            ${{ runner.temp }}/maven-repository/receipts/*.json
            ${{ runner.temp }}/anonymous-downloads.json
            ${{ runner.temp }}/anonymous-consumers/verification.json
            ${{ runner.temp }}/anonymous-consumers/*.txt
